name: build

on:
  push:
    tags:
      - 'v*'
      - 'beta*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        run: VERSION=${{ github.ref_name }} make build build-arm64

      - name: Upload binaries
        uses: actions/upload-artifact@v7.0.2
        with:
          name: discord-runner
          path: |
            discord-runner
            discord-runner-arm64
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8.0.2
        with:
          name: discord-runner
          path: dist

      - name: Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/discord-runner
            dist/discord-runner-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
