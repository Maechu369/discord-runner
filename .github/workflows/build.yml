name: build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        run: make build build-arm64

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: discord-runner
          path: |
            discord-runner
            discord-runner-arm64
          if-no-files-found: error
