name: build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Set up Go
        uses: actions/setup-go@v5.6.0
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        run: VERSION=${{ github.ref_name }} make build build-arm64

      - name: Upload binaries
        uses: actions/upload-artifact@v4.6.2
        with:
          name: discord-runner
          path: |
            discord-runner
            discord-runner-arm64
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4.3.0
        with:
          name: discord-runner
          path: dist

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/discord-runner
            dist/discord-runner-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
